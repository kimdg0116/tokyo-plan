<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EDEEF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="description" content="지역별 동선·가게·준비 체크리스트 — 도쿄 여행 앱">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tokyo Plan">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>Tokyo Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<style>
  :root{
    color-scheme: light dark;
    --ground:#EDEEF1; --surface:#FFFFFF; --surface-2:#E2E5EA;
    --line:#CED3DB; --line-soft:#DFE3E9;
    --ink:#15181D; --ink-2:#474D57; --ink-3:#787F8A;
    --accent:#B23A2E; --accent-ink:#FFF4F2; --accent-soft:#F6E1DD;
    --good:#1C7248; --good-soft:#DCEFE4;
    --star:#C98A0B; --blue:#1F6FEB;
    --sat:#1F6FEB; --sun:#B23A2E; --mon:#1C7248; --tue:#8A5CC9;
    --shadow:0 1px 2px rgba(20,24,30,.08), 0 6px 18px rgba(20,24,30,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#111317; --surface:#1A1D22; --surface-2:#23272E;
      --line:#333942; --line-soft:#282D35;
      --ink:#ECEEF2; --ink-2:#AFB5BF; --ink-3:#7B828D;
      --accent:#F07F6E; --accent-ink:#2A0D08; --accent-soft:#3A1C18;
      --good:#4CC98A; --good-soft:#15301F;
      --star:#F2C14E; --blue:#6EA8FE;
      --sat:#6EA8FE; --sun:#F07F6E; --mon:#4CC98A; --tue:#B49AE8;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#111317; --surface:#1A1D22; --surface-2:#23272E;
    --line:#333942; --line-soft:#282D35;
    --ink:#ECEEF2; --ink-2:#AFB5BF; --ink-3:#7B828D;
    --accent:#F07F6E; --accent-ink:#2A0D08; --accent-soft:#3A1C18;
    --good:#4CC98A; --good-soft:#15301F;
    --star:#F2C14E; --blue:#6EA8FE;
    --sat:#6EA8FE; --sun:#F07F6E; --mon:#4CC98A; --tue:#B49AE8;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.28);
  }
  :root[data-theme="light"]{color-scheme:light}

  html,body{height:100%}
  html,body{touch-action:pan-x pan-y}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box}
  html{-webkit-tap-highlight-color:transparent}
  button{font:inherit;color:inherit;cursor:pointer}
  a{color:inherit}
  img{max-width:100%}
  [hidden]{display:none!important}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
  body.lock{overflow:hidden}

  .wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 84px;display:flex;flex-direction:column;gap:12px}

  .top{
    position:sticky;top:0;z-index:20;background:var(--ground);
    margin-inline:-16px;padding-inline:16px;
    padding-top:calc(12px + env(safe-area-inset-top, 0px));padding-bottom:10px;
    border-bottom:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px;
  }
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-family:Oswald,"IBM Plex Sans KR",sans-serif;font-weight:700;font-size:20px;letter-spacing:.08em;line-height:1;min-width:0}
  .brand small{font-family:"IBM Plex Sans KR",sans-serif;font-size:12px;font-weight:500;letter-spacing:0;color:var(--ink-3);margin-left:8px}
  .icon-btn{
    border:1px solid var(--line);background:var(--surface);border-radius:999px;
    width:36px;height:30px;font-size:14px;line-height:1;display:grid;place-items:center;color:var(--ink-2);padding:0;flex:none;
  }
  .daybar{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
  .daybar::-webkit-scrollbar{display:none}
  .dchip{flex:1 0 auto;min-width:52px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2;color:var(--ink-2)}
  .dchip b{font-size:13px;font-weight:700}
  .dchip span{font-size:10.5px;color:var(--ink-3)}
  .dchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground)}
  .dchip[aria-pressed="true"] b,.dchip[aria-pressed="true"] span{color:var(--ground)}

  .planrow{display:flex;flex-wrap:wrap;gap:8px}
  .viewrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .searchrow{position:relative}
  .searchrow input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 34px 9px 14px;font-size:14px}
  .searchrow input::placeholder{color:var(--ink-3)}
  .searchrow button{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--ink-3);width:30px;height:30px;font-size:15px}
  .searchhit{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft);width:100%;text-align:left;border-left:0;border-right:0;border-top:0;background:transparent}
  .searchhit .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .searchhit .name{font-weight:700;font-size:14.5px}
  .searchhit .where{font-size:12px;color:var(--ink-3)}
  .searchhit .desc{font-size:12.5px;color:var(--ink-2)}
  .viewrow .hint{font-size:12px;color:var(--ink-3)}
  .plantoggle{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 4px 4px 12px;font-size:12.5px;color:var(--ink-2)}
  .plantoggle .seg{border:0;background:var(--surface-2);border-radius:999px;overflow:hidden;display:flex}
  .plantoggle .seg button{border:0;background:transparent;padding:4px 10px;font-size:12px;font-weight:700;color:var(--ink-3)}
  .plantoggle .seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}

  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
  .seg button{border:0;background:transparent;padding:6px 14px;font-size:13px;font-weight:600;color:var(--ink-3);display:flex;align-items:center;gap:4px}
  .seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
  .chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-block:1px 3px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:600}

  .group-h{display:flex;align-items:baseline;gap:8px;margin:10px 2px -2px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-3)}
  .group-h .dot{width:8px;height:8px;border-radius:50%}
  .group-h span.d{color:var(--ink)}
  .list{display:flex;flex-direction:column;gap:10px}

  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;width:100%;text-align:left;border:1px solid var(--line-soft)}
  .rcard{display:block;padding:0;border:0;background:var(--surface)}
  .rcard-strip{height:8px}
  .rcard-body{padding:12px 14px 12px}
  .rcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .rcard-name{font-weight:700;font-size:16.5px;line-height:1.3}
  .rcard-time{font-family:Oswald,sans-serif;font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none;text-align:right}
  .rcard-time small{display:block;font-family:"IBM Plex Sans KR",sans-serif;font-size:10.5px;color:var(--ink-3);font-weight:500}
  .rcard-meta{font-size:12.5px;color:var(--ink-3);margin-top:3px}
  .rcard-note{font-size:12.5px;color:var(--ink-2);margin-top:6px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .rcard-counts{display:flex;gap:10px;margin-top:8px;font-size:12px;color:var(--ink-2);font-weight:600}
  .transitcard{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--radius);width:100%;text-align:left}
  .transitcard .ic{font-size:22px;flex:none}
  .transitcard .info{flex:1;min-width:0}
  .transitcard .name{font-weight:700;font-size:14.5px}
  .transitcard .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
  .transitcard .fare{font-size:12px;color:var(--ink-2);font-weight:600;margin-top:2px}

  .thumb{flex:none;width:72px;height:72px;border-radius:8px;background:var(--surface-2);overflow:hidden;position:relative}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .thumb .noimg{display:grid;place-items:center;height:100%;font-size:20px;color:var(--ink-3);font-weight:700}

  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
  .scrim.on{opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;background:var(--surface);border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease}
  .sheet.on{transform:none}
  .sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px 8px 16px;border-bottom:1px solid var(--line-soft)}
  .sheet-h .grab{font-size:12px;color:var(--ink-3)}
  .sheet-b{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(24px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;gap:16px}
  .sheet-b > *{flex-shrink:0}

  .d-name{font-size:21px;font-weight:700;line-height:1.25;margin:0}
  .d-badges{display:flex;flex-wrap:wrap;gap:6px}
  .badge{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
  .badge.pick{background:var(--accent-soft);color:var(--accent)}
  .badge.day{color:#fff}

  .sec h3{margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
  .sec p{margin:0;font-size:14px;color:var(--ink-2);line-height:1.55}
  .infobar{display:flex;flex-direction:column;gap:4px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px}
  .infobar b{font-size:15px}
  .infobar .sub{color:var(--ink-2);font-size:12.5px}

  .timeline{display:flex;flex-direction:column}
  .trow{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft)}
  .trow:last-child{border-bottom:0}
  .trow .t{flex:none;width:92px;font-family:Oswald,sans-serif;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .trow .w{flex:1;font-size:13.5px;color:var(--ink)}

  .shopcard{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .shopcard:last-child{border-bottom:0}
  .shopcard.done{opacity:.55}
  .shopcard .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .shopcard .name{font-weight:700;font-size:14.5px;line-height:1.3;overflow-wrap:anywhere}
  .shopcard .desc{font-size:12.5px;color:var(--ink-2);line-height:1.45}
  .shopcard .row{font-size:12px;color:var(--ink-3);display:flex;gap:6px;align-items:flex-start}
  .shopcard .row b{font-weight:600;color:var(--ink-2);flex:none}
  .shopcard .other{font-size:11.5px;color:var(--ink-3)}
  /* 영업시간 — 요일 한 줄씩 세로로 (이런 계획 앱들의 공통 표준 포맷) */
  .hourslabel{font-size:12px;font-weight:600;color:var(--ink-2);margin-top:2px}
  .hours{display:flex;flex-direction:column;margin:2px 0 0 2px}
  .hrow{display:flex;gap:8px;align-items:baseline;padding:1.5px 0;font-size:12px}
  .hrow .d{flex:none;width:16px;text-align:center;font-weight:700;color:var(--ink-2)}
  .hrow .d.sun{color:var(--accent)}
  .hrow .d.sat{color:var(--blue)}
  .hrow .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
  .hrow.off .d{color:var(--accent)}
  .hrow.off .t{color:var(--ink-3)}
  .hoursunk{font-size:12px;color:var(--ink-3)}
  .shopcard .btns{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .branchdetails{margin-top:6px}
  .branchdetails summary{list-style:none;cursor:pointer}
  .branchdetails summary::-webkit-details-marker{display:none}
  .branchtoggle{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
  .branchtoggle::after{content:"▾";margin-left:2px}
  .branchdetails[open] .branchtoggle::after{content:"▴"}
  .branchpanel{margin-top:6px;border:1px solid var(--line-soft);border-radius:8px;overflow:hidden}
  .branchrow{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-bottom:1px solid var(--line-soft);font-size:12px}
  .branchrow:last-child{border-bottom:0}
  .branchrow .bl{font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
  .branchrow .ba{color:var(--ink-2)}
  .branchrow .blinks{display:flex;gap:6px;margin-top:3px}
  .branchrow .here{font-size:10.5px;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:999px;padding:1px 7px}
  .minibtn{flex:none;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2);text-decoration:none}
  .minibtn.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .copybtn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;font-size:11px;font-weight:600;padding:1px 8px;color:var(--ink-2);flex:none}

  .spotcard{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line-soft)}
  .spotcard:last-child{border-bottom:0}
  .spotcard .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .spotcard .name{font-weight:700;font-size:14.5px}
  .spotcard .tip{font-size:12.5px;color:var(--ink-2);line-height:1.5}
  .spotcard .meta{font-size:11.5px;color:var(--ink-3)}

  .frow{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line-soft);background:transparent;padding:11px 2px;text-align:left;font-size:14px;color:var(--ink);line-height:1.4}
  .frow:last-child{border-bottom:0}
  .frow .box{flex:none;width:19px;height:19px;margin-top:1px;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px;color:transparent}
  .frow[aria-pressed="true"] .box{background:var(--good);border-color:var(--good);color:#fff}
  .frow[aria-pressed="true"] .t{color:var(--ink-3);text-decoration:line-through}
  .frow .t{flex:1;min-width:0;overflow-wrap:anywhere}
  .grouptitle{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin:14px 2px 2px}
  .grouptitle:first-child{margin-top:2px}
  .progress{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:600}
  .progress b{font-family:Oswald,sans-serif;font-size:16px}


  .mapbox{position:relative;z-index:0;margin-inline:-16px}
  #map{height:calc(100vh - 320px);height:calc(100dvh - 320px);min-height:340px;background:var(--surface-2);border-block:1px solid var(--line-soft)}
  .leaflet-container{font-family:inherit;touch-action:none}
  :root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)} }
  .leaflet-popup-content-wrapper{border-radius:10px;background:var(--surface);color:var(--ink)}
  .leaflet-popup-tip{background:var(--surface)}
  .leaflet-popup-content{margin:10px 12px;min-width:170px}
  .pop-n{font-weight:700;font-size:14.5px;line-height:1.3}
  .pop-m{font-size:12px;color:var(--ink-3);margin:2px 0 8px}
  .pop-b > *{display:block;text-align:center;border:1px solid var(--line);border-radius:8px;padding:5px 6px;font-size:12.5px;font-weight:600;text-decoration:none;background:var(--ink);color:var(--ground)}
  .mapnote{font-size:12px;color:var(--ink-3);padding:8px 16px 0;line-height:1.5}

  .bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .bigbtn{display:flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:11px 8px;font-weight:700;font-size:14px;text-decoration:none;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
  .bigbtn.primary{background:var(--ink);border-color:var(--ink);color:var(--ground)}

  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom, 0px)}
  .tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr)}
  .tabbtn{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;border:0;background:transparent;color:var(--ink-3);font-size:11px;font-weight:600}
  .tabbtn .ic{font-size:19px;line-height:1}
  .tabbtn[aria-pressed="true"]{color:var(--ink)}

  .empty{text-align:center;color:var(--ink-3);padding:40px 12px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--ground);font-size:13px;font-weight:600;border-radius:999px;padding:8px 16px;box-shadow:var(--shadow)}
  .foot{margin-top:6px;text-align:center;font-size:12px;color:var(--ink-3);display:flex;flex-direction:column;gap:3px}
  .foot a{color:var(--ink-2)}
  .ver{font-family:Oswald,sans-serif;letter-spacing:.06em;margin:0}
  .upd{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top, 0px));transform:translateX(-50%);z-index:50;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:13px;border-radius:999px;padding:8px 16px;box-shadow:var(--shadow);white-space:nowrap}
</style>
</head>
<body>
<button type="button" id="upd" class="upd" hidden>새 버전이 있어요 · 눌러서 새로고침</button>

<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="brand">TOKYO PLAN</div>
      <button type="button" class="icon-btn" id="theme" aria-label="화면 테마 바꾸기">◐</button>
    </div>
    <div class="searchrow" id="searchrow"></div>
    <div class="daybar" id="daybar" role="group" aria-label="날짜 선택"></div>
    <div class="planrow" id="planrow"></div>
    <div class="viewrow" id="viewrow"></div>
  </header>

  <main id="main"></main>

  <footer class="foot">
    <span>가게 정보는 여행 전 조사 시점 기준 — 가기 전 구글맵으로 한 번 더 확인.</span>
    <span>체크·안 A/B 선택은 이 기기에만 저장됩니다.</span>
    <p class="ver" id="ver"></p>
    <p class="ver">© Dongkyu Kim</p>
  </footer>
</div>

<nav class="tabbar">
  <div class="tabbar-in" id="tabbar"></div>
</nav>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name" hidden>
  <div class="sheet-h">
    <span class="grab" id="d-where"></span>
    <button type="button" class="icon-btn" data-close aria-label="닫기">✕</button>
  </div>
  <div class="sheet-b" id="d-body"></div>
</section>

<div class="toast" id="toast" hidden></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var DATA = null;
  var regionsById = {};
  var DAY_LABEL = { sat:"토", sun:"일", mon:"월", tue:"화" };
  var DAY_COLOR = { sat:"var(--sat)", sun:"var(--sun)", mon:"var(--mon)", tue:"var(--tue)" };

  function load(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
    });
  }
  function norm(s){ return String(s || "").toLowerCase().replace(/\s+/g, ""); }

  var st = {
    tab: load("tp_tab", "day"),
    day: load("tp_day", "all"),
    plan: load("tp_plan", { sat: "A", sun: "A" }),
    done: load("tp_done", {}),
    check: load("tp_check", {}),
    viewMode: load("tp_viewmode", "list"),
    mapBrand: null,
    openBranches: {},
  };
  if (st.tab === "map") st.tab = "day"; /* 예전 버전 호환 — 지도는 이제 일정 탭 안 토글이다 */

  var searchQuery = "";
  var searchIndex = [];
  function buildSearchIndex(){
    searchIndex = [];
    (DATA.regions || []).forEach(function(r){
      (r.shops || []).forEach(function(s){
        searchIndex.push({ kind: "가게", name: s.name, desc: s.desc || "", region: r });
      });
      (r.photoSpots || []).forEach(function(sp){
        searchIndex.push({ kind: "사진", name: sp.name, desc: sp.tip || "", region: r });
      });
    });
  }

  function planFor(day){ return day === "sat" ? st.plan.sat : day === "sun" ? st.plan.sun : "A"; }
  function regionTime(r){ var p = planFor(r.day); return r["time" + p] || r.timeA || ""; }
  function regionDur(r){ var p = planFor(r.day); return r["dur" + p] || r.durA || ""; }
  function regionVisible(r){ return !r.onlyVariant || r.onlyVariant === planFor(r.day); }

  function mapUrl(item){
    if (item.map) return item.map;
    var q = (item.name || "") + (item.addr ? " " + item.addr : "") + " 東京";
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(q.trim());
  }

  function toast(msg){
    var t = $("toast");
    t.textContent = msg; t.hidden = false;
    clearTimeout(toast._h);
    toast._h = setTimeout(function(){ t.hidden = true; }, 1600);
  }
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function(){ toast("주소를 복사했어요"); }).catch(function(){ toast(text); });
    } else { toast(text); }
  }

  /* ---- 시트 ---- */
  function openSheet(html, whereLabel){
    $("d-body").innerHTML = html;
    $("d-where").textContent = whereLabel || "";
    $("scrim").hidden = false; requestAnimationFrame(function(){ $("scrim").classList.add("on"); });
    $("sheet").hidden = false; requestAnimationFrame(function(){ $("sheet").classList.add("on"); });
    document.body.classList.add("lock");
    $("d-body").scrollTop = 0;
  }
  function closeSheet(){
    $("sheet").classList.remove("on"); $("scrim").classList.remove("on");
    document.body.classList.remove("lock");
    setTimeout(function(){ $("sheet").hidden = true; $("scrim").hidden = true; }, 220);
  }
  $("scrim").addEventListener("click", closeSheet);
  document.querySelectorAll("[data-close]").forEach(function(b){ b.addEventListener("click", closeSheet); });

  /* ---- 상단 날짜 바 ---- */
  function renderDaybar(){
    var bar = $("daybar");
    var days = [{ id: "all", label: "전체", sub: "" }].concat(
      DATA.days.map(function(d){ return { id: d.id, label: DAY_LABEL[d.id], sub: d.label.split(" ")[0] }; })
    );
    bar.innerHTML = days.map(function(d){
      return '<button type="button" class="dchip" data-day="' + d.id + '" aria-pressed="' + (st.day === d.id) + '">' +
        '<b>' + esc(d.label) + '</b><span>' + esc(d.sub) + '</span></button>';
    }).join("");
    bar.querySelectorAll("[data-day]").forEach(function(b){
      b.addEventListener("click", function(){ st.day = b.dataset.day; save("tp_day", st.day); render(); });
    });
  }

  function renderViewToggle(){
    var row = $("viewrow");
    if (st.tab !== "day" || searchQuery.trim()) { row.innerHTML = ""; return; }
    row.innerHTML =
      '<span class="hint">' + (st.viewMode === "map" ? "지도에 표시된 지역 · 숙소" : "지역 목록") + '</span>' +
      '<span class="seg"><button type="button" data-view="list" aria-pressed="' + (st.viewMode === "list") + '">목록</button>' +
      '<button type="button" data-view="map" aria-pressed="' + (st.viewMode === "map") + '">지도</button></span>';
    row.querySelectorAll("[data-view]").forEach(function(b){
      b.addEventListener("click", function(){
        st.viewMode = b.dataset.view; save("tp_viewmode", st.viewMode);
        if (st.viewMode !== "map") st.mapBrand = null;
        render();
      });
    });
  }

  function renderPlanRow(){
    var row = $("planrow");
    if (st.tab !== "day" || searchQuery.trim()) { row.innerHTML = ""; return; }
    var show = [];
    if (st.day === "all" || st.day === "sat") show.push("sat");
    if (st.day === "all" || st.day === "sun") show.push("sun");
    if (!show.length) { row.innerHTML = ""; return; }
    row.innerHTML = show.map(function(day){
      var label = day === "sat" ? "토요일" : "일요일";
      var hint = day === "sat" ? "스크램블 / BIG JOHN" : "이케부쿠로 밤 / 밤 가와고에";
      var cur = st.plan[day];
      return '<div class="plantoggle"><span>' + label + ' 안 <small style="color:var(--ink-3)">(' + hint + ')</small></span>' +
        '<span class="seg"><button type="button" data-planday="' + day + '" data-planval="A" aria-pressed="' + (cur === "A") + '">A</button>' +
        '<button type="button" data-planday="' + day + '" data-planval="B" aria-pressed="' + (cur === "B") + '"' + '>B</button></span></div>';
    }).join("");
    row.querySelectorAll("[data-planday]").forEach(function(b){
      b.addEventListener("click", function(){
        st.plan[b.dataset.planday] = b.dataset.planval;
        save("tp_plan", st.plan);
        render();
      });
    });
  }

  /* ---- 지역 카드 ---- */
  function firstPhoto(r){
    for (var i = 0; i < (r.shops || []).length; i++) if (r.shops[i].photo) return r.shops[i].photo;
    for (var j = 0; j < (r.photoSpots || []).length; j++) if (r.photoSpots[j].photo) return r.photoSpots[j].photo;
    return null;
  }

  function regionCard(r){
    var photo = firstPhoto(r);
    var color = DAY_COLOR[r.day];
    var shopN = (r.shops || []).length, spotN = (r.photoSpots || []).length;
    return '<button type="button" class="card rcard" data-region="' + r.id + '">' +
      '<div class="rcard-strip" style="background:' + color + '"></div>' +
      '<div class="rcard-body">' +
        '<div class="rcard-top">' +
          '<div class="rcard-name">' + esc(r.name) + '</div>' +
          '<div class="rcard-time">' + esc(regionTime(r)) + (regionDur(r) ? '<small>' + esc(regionDur(r)) + '</small>' : '') + '</div>' +
        '</div>' +
        '<div class="rcard-meta">' + esc(r.transport || "") + '</div>' +
        (r.note ? '<div class="rcard-note">' + esc(r.note) + '</div>' : '') +
        '<div class="rcard-counts">' +
          (shopN ? '<span>🛍 ' + shopN + '곳</span>' : '') +
          (spotN ? '<span>📷 ' + spotN + '곳</span>' : '') +
        '</div>' +
      '</div>' +
    '</button>';
  }

  function renderSearchRow(){
    var row = $("searchrow");
    if (st.tab !== "day") { row.innerHTML = ""; return; }
    if (!row.querySelector("input")) {
      row.innerHTML = '<input type="search" id="q" placeholder="가게·사진 검색" autocomplete="off" enterkeyhint="search" value="' + esc(searchQuery) + '">' +
        '<button type="button" id="q-clear" aria-label="검색어 지우기"' + (searchQuery ? "" : " hidden") + '>✕</button>';
      $("q").addEventListener("input", function(){
        searchQuery = this.value;
        $("q-clear").hidden = !searchQuery;
        render();
      });
      $("q-clear").addEventListener("click", function(){
        searchQuery = ""; $("q").value = ""; $("q-clear").hidden = true; $("q").focus();
        render();
      });
    }
  }

  function renderSearchResults(){
    var q = norm(searchQuery);
    var hits = searchIndex.filter(function(it){
      return norm(it.name).indexOf(q) >= 0 || norm(it.desc).indexOf(q) >= 0 || norm(it.region.name).indexOf(q) >= 0;
    });
    var dayMetaById = {};
    DATA.days.forEach(function(d){ dayMetaById[d.id] = d; });
    var html = '<p style="font-size:12.5px;color:var(--ink-3);margin:2px 2px 10px">' + hits.length + '개 찾음</p>';
    html += '<div class="list">' + hits.map(function(it){
      var dm = dayMetaById[it.region.day];
      return '<button type="button" class="card searchhit" data-goregion="' + it.region.id + '">' +
        '<div class="info">' +
          '<div class="name">' + (it.kind === "가게" ? "🛍" : "📷") + ' ' + esc(it.name) + '</div>' +
          (it.desc ? '<div class="desc">' + esc(it.desc) + '</div>' : "") +
          '<div class="where">' + esc(dm ? dm.label : "") + ' · ' + esc(it.region.name) + '</div>' +
        '</div>' +
      '</button>';
    }).join("") + '</div>';
    if (!hits.length) html = '<p class="empty">일치하는 게 없어요</p>';
    $("main").innerHTML = html;
    $("main").querySelectorAll("[data-goregion]").forEach(function(b){
      b.addEventListener("click", function(){ openRegionSheet(b.dataset.goregion); });
    });
  }

  function legsFor(dayId, position){
    return (DATA.transitLegs || []).filter(function(l){ return l.day === dayId && l.position === position; });
  }
  function transitCard(leg){
    return '<button type="button" class="card transitcard" data-transit="' + esc(leg.id) + '">' +
      '<span class="ic">' + esc(leg.icon || "🚉") + '</span>' +
      '<div class="info">' +
        '<div class="name">' + esc(leg.title) + '</div>' +
        '<div class="meta">' + esc(leg.when) + '</div>' +
        '<div class="fare">' + esc(leg.fare) + '</div>' +
      '</div>' +
    '</button>';
  }

  function renderDayTab(){
    var days = st.day === "all" ? DATA.days.map(function(d){ return d.id; }) : [st.day];
    var html = "";
    days.forEach(function(dayId){
      var dayMeta = DATA.days.filter(function(d){ return d.id === dayId; })[0];
      var regions = DATA.regions.filter(function(r){ return r.day === dayId && regionVisible(r); })
        .sort(function(a, b){ return a.order - b.order; });
      var before = legsFor(dayId, "before"), after = legsFor(dayId, "after");
      if (!regions.length && !before.length && !after.length) return;
      html += '<div class="group-h"><span class="dot" style="background:' + DAY_COLOR[dayId] + '"></span>' +
        '<span class="d">' + esc(dayMeta.label) + '</span><span>' + esc(dayMeta.sub) + '</span></div>';
      html += '<div class="list">' + before.map(transitCard).join("") + regions.map(regionCard).join("") + after.map(transitCard).join("") + '</div>';
    });
    $("main").innerHTML = html || '<p class="empty">표시할 일정이 없어요</p>';
    $("main").querySelectorAll("[data-region]").forEach(function(b){
      b.addEventListener("click", function(){ openRegionSheet(b.dataset.region); });
    });
    $("main").querySelectorAll("[data-transit]").forEach(function(b){
      b.addEventListener("click", function(){ openTransitSheet(b.dataset.transit); });
    });
  }

  function openTransitSheet(id){
    var leg = (DATA.transitLegs || []).filter(function(l){ return l.id === id; })[0];
    if (!leg) return;
    var html =
      '<h2 class="d-name">' + esc(leg.icon || "") + ' ' + esc(leg.title) + '</h2>' +
      '<div class="d-badges"><span class="badge">' + esc(leg.when) + '</span><span class="badge">' + esc(leg.fare) + '</span></div>' +
      (leg.method ? '<p>' + esc(leg.method) + '</p>' : "") +
      '<div class="sec"><h3>이동 · 시간</h3><div class="timeline">' + leg.steps.map(function(s){
        return '<div class="trow"><div class="t">' + esc(s.t) + '</div><div class="w">' + esc(s.what) + '</div></div>';
      }).join("") + '</div></div>' +
      (leg.prep && leg.prep.length ? '<div class="sec"><h3>준비할 것</h3><div class="card" style="padding:2px 12px">' +
        leg.prep.map(function(p){
          var on = !!st.check[p];
          return '<button type="button" class="frow" aria-pressed="' + on + '" data-check="' + esc(p) + '">' +
            '<span class="box">✓</span><span class="t">' + esc(p) + '</span></button>';
        }).join("") + '</div></div>' : "") +
      (leg.note ? '<p style="font-size:12.5px;color:var(--ink-3)">' + esc(leg.note) + '</p>' : "");
    openSheet(html, "");
    $("d-body").querySelectorAll("[data-check]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.check;
        st.check[k] = !st.check[k];
        save("tp_check", st.check);
        openTransitSheet(id);
      });
    });
  }

  /* ---- 지역 상세 시트 ---- */
  /* 영업시간 — 요일 한 줄씩 세로로. hours 는 [{day,time,off?}, …] (월~일 고정 순서) */
  function hoursHtml(hours){
    if (!hours) return '<span class="hoursunk">미확인</span>';
    if (typeof hours === "string") return '<span class="hoursunk">' + esc(hours) + '</span>';
    if (!Array.isArray(hours) || !hours.length) return '<span class="hoursunk">미확인</span>';
    return '<div class="hours">' + hours.map(function(r){
      var dcls = r.day === "일" ? "d sun" : r.day === "토" ? "d sat" : "d";
      return '<div class="hrow' + (r.off ? " off" : "") + '"><span class="' + dcls + '">' + esc(r.day) + '</span>' +
        '<span class="t">' + esc(r.time) + '</span></div>';
    }).join("") + '</div>';
  }

  function photoBlock(photo, label){
    if (photo) return '<div class="thumb"><img src="' + esc(photo) + '" alt="" loading="lazy"></div>';
    return '<div class="thumb"><div class="noimg">' + esc((label || "?").slice(0, 1)) + '</div></div>';
  }

  function shopKey(regionId, name){ return regionId + "::" + name; }

  function branchPanel(regionId, s){
    if (!s.brand || !DATA.brands || !DATA.brands[s.brand]) return "";
    var b = DATA.brands[s.brand];
    var others = b.locations.filter(function(loc){ return !(loc.regionId === regionId && loc.shopName === s.name); });
    if (!others.length) return "";
    var rows = others.map(function(loc){
      var here = loc.regionId && regionsById[loc.regionId];
      var hereTag = here ? '<span class="here">일정 · ' + esc(here.name) + '</span>' : "";
      return '<div class="branchrow">' +
        '<div class="bl">' + esc(loc.label) + hereTag + '</div>' +
        (loc.addr ? '<div class="ba">' + esc(loc.addr) + '</div>' : "") +
        hoursHtml(loc.hours) +
        '<div class="blinks">' +
          (here
            ? '<button type="button" class="minibtn" data-goregion2="' + loc.regionId + '">지역 상세</button>'
            : '<a class="minibtn" href="' + mapUrl(loc) + '" target="_blank" rel="noopener">📍 지도</a>') +
        '</div>' +
      '</div>';
    }).join("");
    return '<details class="branchdetails"><summary class="branchtoggle">다른 지점 (' + others.length + ')</summary>' +
      '<div class="branchpanel">' + rows +
      '<div style="padding:8px 10px"><button type="button" class="minibtn" data-brandmap="' + esc(s.brand) + '">🗺 지도에서 모아보기</button></div>' +
      '</div></details>';
  }

  function shopRow(regionId, s){
    var key = shopKey(regionId, s.name);
    var isDone = !!st.done[key];
    return '<div class="shopcard' + (isDone ? ' done' : '') + '">' +
      photoBlock(s.photo, s.name) +
      '<div class="info">' +
        '<div class="name">' + esc(s.name) + (s.badge ? ' <span class="badge pick">' + esc(s.badge) + '</span>' : '') + '</div>' +
        (s.desc ? '<div class="desc">' + esc(s.desc) + '</div>' : '') +
        '<div class="hourslabel">시간</div>' + hoursHtml(s.hours) +
        (s.addr ? '<div class="row"><b>주소</b><span>' + esc(s.addr) + '</span><button type="button" class="copybtn" data-copy="' + esc(s.addr) + '">복사</button></div>' : '') +
        (!s.brand && s.other ? '<div class="other">다른 지점: ' + esc(s.other) + '</div>' : '') +
        '<div class="btns">' +
          '<a class="minibtn" href="' + mapUrl(s) + '" target="_blank" rel="noopener">📍 지도</a>' +
          '<button type="button" class="minibtn' + (isDone ? ' on' : '') + '" data-donekey="' + esc(key) + '">' + (isDone ? '✓ 완료' : '완료 체크') + '</button>' +
        '</div>' +
        branchPanel(regionId, s) +
      '</div>' +
    '</div>';
  }

  function spotRow(sp){
    return '<div class="spotcard">' +
      photoBlock(sp.photo, sp.name) +
      '<div class="info">' +
        '<div class="name">' + esc(sp.name) + '</div>' +
        (sp.tip ? '<div class="tip">' + esc(sp.tip) + '</div>' : '') +
        '<div class="meta">' + [sp.time, sp.cost === "0" ? "무료" : sp.cost].filter(Boolean).join(" · ") + '</div>' +
        '<div class="btns"><a class="minibtn" href="' + mapUrl(sp) + '" target="_blank" rel="noopener">📍 지도</a></div>' +
      '</div>' +
    '</div>';
  }

  function timelineHtml(r){
    var p = planFor(r.day);
    var steps = (r.timeline || []).concat(r["timeline" + p] || []);
    if (!steps.length) {
      return '<div class="infobar"><b>' + esc(regionTime(r)) + '</b><span class="sub">' + esc(regionDur(r)) + '</span><span class="sub">' + esc(r.transport || "") + '</span></div>';
    }
    return '<div class="infobar" style="margin-bottom:8px"><span class="sub">' + esc(r.transport || "") + '</span></div>' +
      '<div class="timeline">' + steps.map(function(s){
        return '<div class="trow"><div class="t">' + esc(s.t) + '</div><div class="w">' + esc(s.what) + '</div></div>';
      }).join("") + '</div>';
  }

  function nearbyBranches(regionId){
    var out = [];
    Object.keys(DATA.brands || {}).forEach(function(bid){
      var b = DATA.brands[bid];
      b.locations.forEach(function(loc){
        if (loc.nearRegionId === regionId) out.push({ brandId: bid, brandName: b.name, loc: loc });
      });
    });
    return out;
  }
  function homeOfBrand(bid){
    var members = DATA.brands[bid].locations.filter(function(l){ return l.regionId; });
    return members.length ? members[0] : null;
  }
  function nearbyRow(item){
    var loc = item.loc;
    var home = homeOfBrand(item.brandId);
    return '<div class="branchrow">' +
      '<div class="bl">' + esc(item.brandName) + ' · ' + esc(loc.label) + '</div>' +
      (loc.addr ? '<div class="ba">' + esc(loc.addr) + '</div>' : "") +
      hoursHtml(loc.hours) +
      '<div class="blinks">' +
        '<a class="minibtn" href="' + esc(loc.map || mapUrl({ name: item.brandName + " " + loc.label, addr: loc.addr })) + '" target="_blank" rel="noopener">📍 지도</a>' +
        (home ? '<button type="button" class="minibtn" data-goregion2="' + home.regionId + '">원래 지점 · ' + esc(regionsById[home.regionId].name) + '</button>' : "") +
      '</div>' +
    '</div>';
  }
  function nearbyPanel(regionId){
    var items = nearbyBranches(regionId);
    if (!items.length) return "";
    return '<div class="sec"><h3>이 근처 · 다른 지점 (참고, ' + items.length + ')</h3>' +
      '<p style="margin-bottom:8px">일정엔 없지만 이 지역 도보권(1km 이내)이다. 원래 지점에서 못 샀으면 여기서.</p>' +
      items.map(nearbyRow).join("") + '</div>';
  }

  function openRegionSheet(id){
    var r = DATA.regions.filter(function(x){ return x.id === id; })[0];
    if (!r) return;
    var dayMeta = DATA.days.filter(function(d){ return d.id === r.day; })[0];
    var html =
      '<h2 class="d-name">' + esc(r.name) + '</h2>' +
      '<div class="d-badges"><span class="badge day" style="background:' + DAY_COLOR[r.day] + '">' + esc(dayMeta.label) + '</span>' +
      '<span class="badge">' + esc(regionTime(r)) + '</span>' + (regionDur(r) ? '<span class="badge">' + esc(regionDur(r)) + '</span>' : '') + '</div>' +
      (r.note ? '<p>' + esc(r.note) + '</p>' : '') +
      '<div class="sec"><h3>이동 · 시간</h3>' + timelineHtml(r) + '</div>' +
      (r.shops && r.shops.length ? '<div class="sec"><h3>가게 목록 (' + r.shops.length + ')</h3>' + r.shops.map(function(s){ return shopRow(r.id, s); }).join("") + '</div>' : "") +
      (r.photoSpots && r.photoSpots.length ? '<div class="sec"><h3>사진 (' + r.photoSpots.length + ')</h3>' + r.photoSpots.map(spotRow).join("") + '</div>' : "") +
      nearbyPanel(r.id);
    openSheet(html, dayMeta.label);
    $("d-body").querySelectorAll("[data-copy]").forEach(function(b){
      b.addEventListener("click", function(){ copyText(b.dataset.copy); });
    });
    $("d-body").querySelectorAll("[data-donekey]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.donekey;
        st.done[k] = !st.done[k];
        save("tp_done", st.done);
        openRegionSheet(id);
      });
    });
    $("d-body").querySelectorAll("[data-goregion2]").forEach(function(b){
      b.addEventListener("click", function(){ openRegionSheet(b.dataset.goregion2); });
    });
    $("d-body").querySelectorAll("[data-brandmap]").forEach(function(b){
      b.addEventListener("click", function(){ openBrandMap(b.dataset.brandmap); });
    });
  }

  /* ---- 준비 탭 ---- */
  function renderPrepTab(){
    var groups = DATA.checklist;
    var total = 0, done = 0;
    groups.forEach(function(g){ g.items.forEach(function(it){ total++; if (st.check[it]) done++; }); });
    var html = '<div class="progress"><span>준비 완료</span><span><b>' + done + '</b> / ' + total + '</span></div>';
    groups.forEach(function(g){
      html += '<div class="grouptitle">' + esc(g.group) + '</div>';
      html += '<div class="card" style="padding:2px 12px">' + g.items.map(function(it){
        var on = !!st.check[it];
        return '<button type="button" class="frow" aria-pressed="' + on + '" data-check="' + esc(it) + '">' +
          '<span class="box">✓</span><span class="t">' + esc(it) + '</span></button>';
      }).join("") + '</div>';
    });
    html += '<p style="font-size:12px;color:var(--ink-3);margin:2px 4px">옵시디언 노트 <b>「24 출발 전 준비 체크리스트」</b>와 같은 목록입니다. 체크는 이 기기에만 저장돼요.</p>';
    $("main").innerHTML = html;
    $("main").querySelectorAll("[data-check]").forEach(function(b){
      b.addEventListener("click", function(){
        var k = b.dataset.check;
        st.check[k] = !st.check[k];
        save("tp_check", st.check);
        renderPrepTab();
      });
    });
  }


  /* ---- 지도 (일정 탭 안 토글) ---- */
  var leafletMap = null;
  function dotIcon(color, big){
    var s = big ? 22 : 16;
    return L.divIcon({
      className: "", html: '<div style="width:' + s + 'px;height:' + s + 'px;border-radius:50%;background:' + color + ';border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4)"></div>',
      iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    });
  }
  var PHOTO_COLOR = "#D6409F";
  function photoIcon(){
    var s = 13;
    return L.divIcon({
      className: "", html: '<div style="width:' + s + 'px;height:' + s + 'px;background:' + PHOTO_COLOR + ';border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);border-radius:3px;transform:rotate(45deg)"></div>',
      iconSize: [s, s], iconAnchor: [s / 2, s / 2],
    });
  }
  function openBrandMap(brandId){
    st.mapBrand = brandId; st.viewMode = "map"; st.tab = "day";
    save("tp_viewmode", st.viewMode);
    closeSheet();
    render();
  }
  function renderMapTab(){
    var brand = st.mapBrand ? DATA.brands[st.mapBrand] : null;
    var banner = brand
      ? '<div class="plantoggle" style="margin:0 0 10px"><span><b>' + esc(brand.name) + '</b> 다른 지점 지도</span>' +
        '<button type="button" class="minibtn" id="clear-brand-map">← 전체 지도</button></div>'
      : "";
    $("main").innerHTML = banner + '<div class="mapbox"><div id="map"></div>' +
      '<p class="mapnote">● 지역 · 🏨 숙소(검정) · ◆ 사진. 지도 원본 표기는 일본어입니다. 정확한 한국어 표기·경로는 📍 지도 버튼(구글맵 앱)을 쓰세요 — 폰 언어가 한국어면 구글맵 앱도 한국어로 뜹니다.</p></div>';
    var clearBtn = document.getElementById("clear-brand-map");
    if (clearBtn) clearBtn.addEventListener("click", function(){ st.mapBrand = null; render(); });
    setTimeout(function(){
      if (!window.L) return;
      if (leafletMap) { leafletMap.remove(); leafletMap = null; }
      leafletMap = L.map("map", { zoomControl: true }).setView([35.72, 139.72], 11);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "© OpenStreetMap"
      }).addTo(leafletMap);

      /* 숙소 — 항상 표시 */
      if (DATA.hotel && DATA.hotel.lat != null) {
        var hm = L.marker([DATA.hotel.lat, DATA.hotel.lng], { icon: dotIcon("#111", true) }).addTo(leafletMap);
        hm.bindPopup('<div class="pop-n">🏨 ' + esc(DATA.hotel.name) + '</div><div class="pop-m">' + esc(DATA.hotel.desc || "숙소") + '</div>' +
          '<div class="pop-b"><a href="' + mapUrl(DATA.hotel) + '" target="_blank" rel="noopener">구글맵</a></div>');
      }

      if (brand) {
        brand.locations.forEach(function(loc){
          var isHere = !!loc.regionId;
          var lat = loc.lat, lng = loc.lng, hours = loc.hours, addr = loc.addr, mapLink = loc.map;
          if (isHere) {
            /* 일정에 이미 있는 지점은 좌표·시간을 가게 항목에서 그대로 가져온다 */
            var region = regionsById[loc.regionId];
            var shop = region && (region.shops || []).filter(function(x){ return x.name === loc.shopName; })[0];
            if (shop) { lat = shop.lat; lng = shop.lng; hours = shop.hours; addr = shop.addr; mapLink = shop.map; }
          }
          if (lat == null) return;
          var color = isHere ? (getComputedStyle(document.documentElement).getPropertyValue("--" + regionsById[loc.regionId].day) || "#B23A2E") : "#8A5CC9";
          var m = L.marker([lat, lng], { icon: dotIcon(color) }).addTo(leafletMap);
          var html = '<div class="pop-n">' + esc(loc.label) + (isHere ? " · 일정에 있음" : "") + '</div>' +
            '<div class="pop-m">' + hoursHtml(hours) + '</div>' +
            '<div class="pop-b">' + (isHere ? '<button type="button" data-goregion="' + loc.regionId + '">지역 상세</button>' : '<a href="' + esc(mapLink || mapUrl({ name: loc.label, addr: addr })) + '" target="_blank" rel="noopener">구글맵</a>') + '</div>';
          m.bindPopup(html);
          m.on("popupopen", bindPopupGoRegion);
        });
        return;
      }

      var visibleRegions = DATA.regions.filter(function(r){ return (st.day === "all" || r.day === st.day) && regionVisible(r); });
      visibleRegions.forEach(function(r){
        if (r.lat == null) return;
        var color = getComputedStyle(document.documentElement).getPropertyValue("--" + r.day) || "#B23A2E";
        var m = L.marker([r.lat, r.lng], { icon: dotIcon(color) }).addTo(leafletMap);
        var shopN = (r.shops || []).length;
        var html = '<div class="pop-n">' + esc(r.name) + '</div><div class="pop-m">' + esc(regionTime(r)) + ' · 가게 ' + shopN + '곳</div>' +
          '<div class="pop-b"><button type="button" data-goregion="' + r.id + '">자세히</button></div>';
        m.bindPopup(html);
        m.on("popupopen", bindPopupGoRegion);
      });

      /* 사진 — 지역과 같은 필터를 쓰되 마름모 마커로 구분 */
      visibleRegions.forEach(function(r){
        (r.photoSpots || []).forEach(function(sp){
          if (sp.lat == null) return;
          var m = L.marker([sp.lat, sp.lng], { icon: photoIcon() }).addTo(leafletMap);
          var html = '<div class="pop-n">📷 ' + esc(sp.name) + '</div>' +
            (sp.tip ? '<div class="pop-m">' + esc(sp.tip) + '</div>' : "") +
            '<div class="pop-b"><button type="button" data-goregion="' + r.id + '">' + esc(r.name) + ' 보기</button></div>';
          m.bindPopup(html);
          m.on("popupopen", bindPopupGoRegion);
        });
      });
    }, 30);
  }
  function bindPopupGoRegion(){
    document.querySelectorAll("[data-goregion]").forEach(function(b){
      b.addEventListener("click", function(){ if (leafletMap) leafletMap.closePopup(); openRegionSheet(b.dataset.goregion); });
    });
  }

  /* ---- 탭바 ---- */
  var TABS = [
    { id: "day", ic: "🗺️", label: "일정" },
    { id: "prep", ic: "✅", label: "준비" },
  ];
  function renderTabbar(){
    $("tabbar").innerHTML = TABS.map(function(t){
      return '<button type="button" class="tabbtn" data-tab="' + t.id + '" aria-pressed="' + (st.tab === t.id) + '">' +
        '<span class="ic">' + t.ic + '</span><span>' + t.label + '</span></button>';
    }).join("");
    $("tabbar").querySelectorAll("[data-tab]").forEach(function(b){
      b.addEventListener("click", function(){ st.tab = b.dataset.tab; save("tp_tab", st.tab); render(); });
    });
  }

  function render(){
    var searching = st.tab === "day" && searchQuery.trim().length > 0;
    $("daybar").hidden = (st.tab !== "day" || searching);
    renderSearchRow();
    renderDaybar();
    renderPlanRow();
    renderViewToggle();
    renderTabbar();
    if (st.tab === "day") {
      if (searching) renderSearchResults();
      else if (st.viewMode === "map") renderMapTab();
      else renderDayTab();
    }
    else if (st.tab === "prep") renderPrepTab();
  }

  /* ---- 테마 ---- */
  function applyTheme(){
    var t = load("tp_theme", "auto");
    document.documentElement.setAttribute("data-theme", t === "auto" ? "" : t);
    $("theme").textContent = t === "light" ? "☀" : t === "dark" ? "●" : "◐";
  }
  $("theme").addEventListener("click", function(){
    var t = load("tp_theme", "auto");
    var next = t === "auto" ? "light" : t === "light" ? "dark" : "auto";
    save("tp_theme", next);
    applyTheme();
  });
  applyTheme();

  /* ---- 로드 ---- */
  fetch("./data.json?t=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(j){
      DATA = j;
      (j.regions || []).forEach(function(r){ regionsById[r.id] = r; });
      buildSearchIndex();
      $("ver").textContent = "업데이트 " + j.updated;
      render();
    })
    .catch(function(){
      $("main").innerHTML = '<p class="empty">데이터를 불러오지 못했어요. 새로고침 해보세요.</p>';
    });
})();
</script>

<script>
  (function(){
    var CURRENT = "26.09.22-0006";
    var btn = document.getElementById("upd");
    var latest = null;
    function check(){
      fetch("./version.json?t=" + Date.now(), { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(j){ if (j && j.version && j.version !== CURRENT){ latest = j.version; if (btn) btn.hidden = false; } })
        .catch(function(){});
    }
    if (btn) btn.addEventListener("click", function(){
      btn.textContent = "업데이트 중…";
      var clear = window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : Promise.resolve();
      var upd = ("serviceWorker" in navigator) ? navigator.serviceWorker.getRegistration().then(function(r){ return r ? r.update() : null; }) : Promise.resolve();
      Promise.all([clear.catch(function(){}), upd.catch(function(){})]).then(function(){
        location.replace("./index.html?v=" + encodeURIComponent(latest || Date.now()));
      });
    });
    window.addEventListener("load", function(){
      if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(function(){});
      check();
    });
    document.addEventListener("visibilitychange", function(){ if (document.visibilityState === "visible") check(); });
  })();
</script>
</body>
